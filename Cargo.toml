# Workspace: the bridge and its diagnostics are safe Rust; the only unsafe code (SteamVR's C API and three
# Win32 calls) lives in the `*-sys` members, behind safe wrappers, the same split as pade's src-tauri.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/avi12/quest-touch-to-wii-emulation"
publish = false

[profile.release]
codegen-units = 1
lto = true
strip = true

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[workspace.lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# avi12-lint:end
