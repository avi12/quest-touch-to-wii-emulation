name: Bug report
description: File a bug report
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      placeholder: E.g. "The cursor drifts to a corner after recentering"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      placeholder: Include the bridge log and a screen recording, if possible
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset and connection
      placeholder: E.g. Quest 2 over Air Link
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Dolphin and Rust versions
      placeholder: E.g. Dolphin 2609b, rustc 1.100.0
    validations:
      required: true
  - type: checkboxes
    id: reported
    attributes:
      label: Make sure the bug wasn't reported before
      options:
        - label: I'm the first one to [report](https://github.com/avi12/quest-touch-to-wii-emulation/issues?q=is%3Aissue) it
          required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
