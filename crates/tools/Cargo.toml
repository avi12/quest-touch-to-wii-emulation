[package]
name = "tools"
description = "Diagnostics for the bridge: DSU probe, device list, pointing-axis calibration, telemetry summary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bridge = { path = "../bridge" }
dsu = { path = "../dsu" }
geometry = { path = "../geometry" }
numeric = { path = "../numeric" }
openvr-sys = { path = "../openvr-sys" }

[[bin]]
name = "dsu_probe"
path = "src/bin/dsu_probe.rs"

[[bin]]
name = "list_devices"
path = "src/bin/list_devices.rs"

[[bin]]
name = "controller_tip_pose"
path = "src/bin/controller_tip_pose.rs"

[[bin]]
name = "calibrate_pointing_axis"
path = "src/bin/calibrate_pointing_axis.rs"

[[bin]]
name = "telemetry_tail"
path = "src/bin/telemetry_tail.rs"

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# Command-line diagnostics: no public API
missing_docs = "allow"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# avi12-lint:end
